<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contract Whist Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>🃏 Contract Whist</h1>
    <nav>
      <button id="nav-new" class="nav-btn active">New Game</button>
      <button id="nav-history" class="nav-btn">History</button>
    </nav>
  </header>

  <!-- SETUP -->
  <section id="view-setup" class="view">
    <h2>Game Setup</h2>
    <div class="setup-grid">
      <label>
        Number of players
        <input type="number" id="setup-players" inputmode="numeric" pattern="[0-9]*" min="2" max="7" value="4" />
      </label>
      <label>
        Starting cards
        <input type="number" id="setup-start" inputmode="numeric" pattern="[0-9]*" min="1" value="13" />
        <small id="setup-max-note">Max for 4 players: 13</small>
      </label>
      <label>
        Direction
        <select id="setup-direction">
          <option value="down">Down only (e.g. 7→1)</option>
          <option value="updown" selected>Up &amp; down (e.g. 7→1→7)</option>
        </select>
      </label>
    </div>
    <p class="setup-hint">Enter players in seating order (clockwise). The dealer rotates after each round.</p>
    <div id="setup-names"></div>

    <div class="starter-row">
      <span class="starter-label">First dealer (deals round 1):</span>
      <div id="starter-buttons"></div>
    </div>

    <button id="start-game" class="primary">Start Game</button>
  </section>

  <!-- GAME -->
  <section id="view-game" class="view hidden">
    <div class="game-header">
      <div class="round-info">
        <div class="round-num">Round <span id="round-current">1</span> / <span id="round-total">–</span></div>
        <div class="round-meta">
          <span class="trump"><span class="trump-label">Trump:</span> <span id="trump-card">♠</span></span>
          <span class="cards"><span id="card-count">7</span> cards</span>
          <span class="bid-summary" id="bid-summary"></span>
          <span class="round-timer" id="round-timer" title="Elapsed time this round">⏱ 0:00</span>
        </div>
        <div class="dealer-info">Dealer: <b id="dealer-name">–</b> · Bids last</div>
      </div>
      <div class="header-actions">
        <button id="quick-entry-btn" class="secondary">⚡ Quick entry</button>
        <button id="end-game-btn" class="secondary">End Game</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="scoretable" id="game-table"></table>
    </div>

    <div class="bid-warning" id="bid-warning"></div>

    <div class="game-actions">
      <button id="lock-bids" class="primary">Lock Bids → Play</button>
      <button id="commit-round" class="primary hidden">Score Round</button>
      <button id="undo-round" class="secondary">Undo</button>
    </div>
  </section>

  <!-- SUMMARY -->
  <section id="view-summary" class="view hidden">
    <h2>🏆 Game Summary</h2>
    <div id="winner-banner"></div>
    <div id="share-row" class="share-row hidden">
      <button id="share-game-btn" class="primary">🔗 Copy shareable link</button>
      <span id="share-status" class="share-status"></span>
    </div>
    <canvas id="score-chart"></canvas>
    <div id="stats-block"></div>
    <table class="scoretable" id="final-table"></table>
    <div id="position-stats"></div>
    <div class="game-actions">
      <button id="play-again" class="primary">New Game</button>
      <button id="view-history-btn" class="secondary">View History</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view hidden">
    <h2>Past Games</h2>
    <div id="history-list"></div>
    <button id="clear-history" class="secondary">Clear All History</button>
  </section>
</div>

<!-- Quick entry modal -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Quick entry</h3>
      <button id="modal-close" class="secondary">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-sub" id="modal-sub"></div>
      <div class="modal-player" id="modal-player">–</div>
      <div class="modal-position" id="modal-position"></div>
      <input id="modal-input" type="number" inputmode="numeric" pattern="[0-9]*" class="modal-input" placeholder="0" />
      <div class="modal-hint" id="modal-hint"></div>
      <div class="modal-pad" id="modal-pad"></div>
    </div>
    <div class="modal-actions">
      <button id="modal-back" class="secondary">← Back</button>
      <button id="modal-next" class="primary">Next →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
